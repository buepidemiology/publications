name: Update group publications

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'   # every Monday at 11:00 UTC (7 AM Eastern in summer, 6 AM in winter)
  push:
    paths:
      - 'ORCIDs.xlsx'                    # rebuild right away when the roster changes
      - 'data/ORCIDs.xlsx'
      - 'scripts/build_publications.py'  # rebuild when the page builder changes
      - '.github/workflows/update-publications.yml'

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Retrieve public ORCID works (ORCID API only)
        run: python scripts/build_publications.py

      - name: Save updated publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update group publications"
          git pull --rebase
          git push
