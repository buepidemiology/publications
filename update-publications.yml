name: Update group publications

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'   # every Monday at 11:00 UTC (7 AM Eastern in summer, 6 AM in winter)
  push:
    paths:
      - 'data/ORCIDs.xlsx'   # rebuild right away when the roster changes

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Retrieve public ORCID works (ORCID API only)
        run: python scripts/build_publications.py

      - name: Save updated publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update group publications"
          git push
